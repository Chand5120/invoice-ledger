version: "3.9"

services:
  dbt:
    image: python:3.11-slim
    working_dir: /app/data
    volumes:
      - .:/app
    command: >
      bash -c "pip install dbt-duckdb --quiet &&
               dbt seed --profiles-dir . &&
               dbt run --profiles-dir ."
    profiles: ["setup"]

  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      bash -c "pip install -r requirements.txt --quiet &&
               uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - dbt

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: >
      bash -c "npm install && npm run dev -- --host"
